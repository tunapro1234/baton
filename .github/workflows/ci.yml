name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:guardrail
      - run: npm run eval:numbers
      - run: npm run check:voice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-ready-report
          path: report.json
          if-no-files-found: ignore
